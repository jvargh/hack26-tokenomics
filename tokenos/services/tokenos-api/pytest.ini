[pytest]
testpaths = tests
python_files = test_*.py
python_classes =
python_functions = test_*
asyncio_mode = auto
addopts = --ignore=tests/browser

; tests/browser holds the Playwright suites (e2e_*.py) and their own conftest.py.
; They are ignored here so this default run stays credential-free and fast, and so
; the browser conftest never shadows `from conftest import run_workflow` used by the
; API tests. Run them explicitly with: pytest -c pytest-browser.ini

; Legacy manual/live verification scripts (test_workflows_e2e.py, test_workflows_live.py,
; test_full_matrix.py, check_prove_numbers.py) live alongside the automated suite in
; tests/. They expose no `def test_*` functions -- only `if __name__ == "__main__":`
; entry points meant to run against a real server (local or live Foundry) -- so pytest
; discovers and imports them but collects zero test items from them. See README/API docs
; for how to run them manually.
